summary: >-
  CharitySense ships NO Model Context Protocol server, and says so in machine-readable form: GET
  https://data.charitysense.com/mcp.json returns {"mcp_server": false, "notice": "No Model Context Protocol
  transport is exposed at this origin. Use the OpenAPI contract for callable HTTP tools."} (saved verbatim as
  mcp/charitysense-com-mcp-compatibility-notice.json), the RFC 9727 api-catalog lists that document under
  service-meta as "MCP compatibility notice", and INSTRUCTIONS_FOR_AGENTS.md repeats "no MCP transport is
  exposed". /mcp and /.well-known/mcp.json both 404. The tool list below is therefore a CANDIDATE derived one
  tool per operationId from the provider's own 21-operation OpenAPI 3.1.0 contract, for anyone who wants to wrap
  the REST API; nothing here is a claim that the provider serves it.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    mode none because nobody ships a server. If one were built from this candidate list it would need the
    contract's two schemes for Advanced tools: Authorization: Bearer <token> or X-CharitySense-API-Key; the seven
    public research tools need no credential but share a 1,000 request per UTC day allowance per client.
