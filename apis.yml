aid: charitysense-com
name: CharitySense
description: >-
  CharitySense is a product of Osci Labs LLC (US) with two public surfaces. charitysense.com is an edge-AI
  verification platform that plugs into cameras already installed at funded hospitals, schools, water wells and
  orphanages, processes video on-device, and gives donors, foundations, NGOs and governments live dashboards
  proving a funded project is actually running. data.charitysense.com is CharitySense Data, an agent-ready
  nonprofit due-diligence API over public IRS Form 990 filings for about 2.2 million U.S. nonprofits: charity
  search, bounded profile pages with lazily fetched sections, filing history, money-network and grant-flow
  evidence, related-organization discovery, dataset statistics and a paid assistant. It is a 21-operation OpenAPI
  3.1.0 contract at https://data.charitysense.com/openapi.yaml; research reads need no key (1,000 per UTC day),
  Advanced operations need a paid key. The host also serves an RFC 9727 API catalog, an A2A-shaped agent card,
  ai-plugin.json and llms.txt.
