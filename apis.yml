apis:
- aid: charitysense-com:charitysense-data-api
  name: CharitySense Data API
  description: >-
    Canonical REST API for U.S. nonprofit due diligence compiled from public IRS Form 990 filings and official-source
    profile enrichment. 21 operations across five tags: Profiles (bounded charity page, advertised sections, filings,
    brand icon, money network, awards, subawards, grantees, funders), Discovery (identity and discovery search, top
    lists, cohort funders, related-organization discovery, bulk diligence summary), Dataset (health, stats), Assistant
    (charity question, agent feedback, capabilities, SSE chat stream) and Usage (per-key daily allowance). Public
    research GETs need no token and are limited to 1,000 requests per UTC day per client; derived reads and every
    POST are Advanced operations that require a paid bearer token or X-CharitySense-API-Key and return 403
    EntitlementRequired anonymously. Responses use UpperCamelCase fields. Published as OpenAPI 3.1.0 at
    https://data.charitysense.com/openapi.yaml with servers[] https://data.charitysense.com.
