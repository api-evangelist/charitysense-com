conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: OPENAPI
  transport: OPENAPI (via supportedInterfaces[0].protocolBinding and preferredTransport) - not an A2A-defined transport
  a2a_callable: false
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: 'Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming, pushNotifications,
    stateTransitionHistory, extendedAgentCard, supportsAuthenticatedExtendedCard all false and one extension entry.
    protocolVersion is present at the top level as "0.3.0" (pass) and repeated on supportedInterfaces[0]. skills
    is an ARRAY (pass) of 9 fully-populated skills, each with id, name, description, tags, examples, inputModes,
    outputModes and an (empty) securityRequirements list. All three optional discriminators - defaultInputModes,
    defaultOutputModes and preferredTransport - are declared. The structural grade is therefore conformant. READ
    THE DEVIATIONS BEFORE TREATING THIS AS AN A2A AGENT: the card''s own `notice` field states that CharitySense
    does not expose an A2A JSON-RPC task endpoint, every declared interface is the OpenAPI/HTTP contract, and the
    provider''s INSTRUCTIONS_FOR_AGENTS.md calls this document an ''OpenAPI compatibility card; no A2A task endpoint''.
    It is a structurally valid AgentCard describing a REST API, not a reachable A2A agent.'
  deviations:
  - field: preferredTransport / supportedInterfaces[].protocolBinding
    observed: '"OPENAPI"'
    note: A2A 1.0.0 defines JSONRPC, GRPC and HTTP+JSON transports; OPENAPI is not one of them. An A2A client that
      dispatches on transport will find nothing it can speak. additionalInterfaces[1] declares HTTP+JSON at https://data.charitysense.com,
      but that host serves the REST API, not the A2A HTTP+JSON binding (SendMessage / GetTask methods), so it is
      not a usable A2A interface either.
  - field: notice
    observed: '"It does not expose an A2A JSON-RPC task endpoint. Use openapi.yaml for the callable operation and
      security contract."'
    note: The provider says in the card itself that the card is not backed by an A2A endpoint. This is honest and
      useful, and it is why a2a_callable is false despite the conformant structural grade.
  - field: url
    observed: https://data.charitysense.com
    note: The A2A url is meant to be the agent endpoint; here it is the REST API origin. GET returns the SPA landing
      page.
  - field: securitySchemes / security
    observed: '{} and []'
    note: The card declares no security while the API it binds to requires a bearer token or X-CharitySense-API-Key
      for every Advanced operation, including the sendAgentFeedback primaryTool and three POST skills. The auth
      requirement is described in prose (api.auth, operation_policy) rather than machine-readably. skills[].securityRequirements
      are all empty for the same reason.
  - field: readOnly
    observed: 'false'
    note: 'Correct: three skills (send_agent_feedback plus the assistant operations behind analyze/discover) map
      to POSTs the provider labels consequential and gates behind confirmation.'
  - field: capabilities.extensions[0].uri
    observed: https://spec.openapis.org/oas/v3.1.0
    note: Uses the A2A extension slot to point at the OpenAPI specification URI, with description naming the contract
      URL. Non-standard use of extensions, but harmless and self-describing.
  - field: non-A2A top-level keys
    observed: api, discovery, coverage, citation, primaryTools, capabilityTags, agentIdentity, feedbackUrl, readOnly,
      auth, notice
    note: Eleven vendor fields sit beside the A2A fields at the top level rather than under an extension. A strict
      reader ignores them; a lenient one gets a useful discovery map (llms.txt, ai.txt, instructions, api-catalog,
      sitemap, citation template).
  - field: legacy /.well-known/agent.json
    observed: served, different shape
    note: 'The legacy path is not a copy of the canonical card: it is a manifest with schema_version 1.0, legal_name,
      legalEntity (Osci Labs LLC, EIN 99-0651763), contact, support_url, privacy_policy_url, custom_gpt_url and
      a primary_tools list. It still passes the same three hard checks (capabilities object, protocolVersion, skills
      array). Saved verbatim beside the card.'
surface_relationship:
  note: 'CharitySense publishes ONE callable surface - the 21-operation REST API at https://data.charitysense.com
    (openapi/charitysense-com-openapi.yml) - and describes it through several agent-facing documents: this A2A-shaped
    card, the legacy agent manifest, an ai-plugin.json import manifest, an ai-profile.json, ai.txt, llms.txt, llms-full.txt,
    INSTRUCTIONS_FOR_AGENTS.md and an RFC 9727 api-catalog. There is no MCP server (/mcp.json is an explicit ''mcp_server:
    false'' compatibility notice) and no A2A task endpoint. The card''s 9 skills map onto the primaryTools list
    and then onto OpenAPI operationIds: search_charities -> searchOrganizations, get_charity_profile -> getCharityPage,
    get_charity_section -> getCharitySection, get_charity_filings -> getCharityFilings, analyze_money_flows -> getCharityMoneyNetwork,
    discover_related_organizations -> discoverRelatedOrganizations, get_dataset_stats -> getStats, send_agent_feedback
    -> submitAgentFeedback; cite_public_charity_profile targets the HTML /charity/{ein} pages rather than an API
    operation.'
