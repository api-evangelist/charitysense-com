- id: idempotency-key
  name: Idempotency-Key (draft-ietf-httpapi-idempotency-key-header)
  conforms: false
  evidence: >-
    None of the three POST operations (submitCharityQuestion, submitAgentFeedback, streamAssistantChat) declare an
    idempotency header or key field, and the docs describe none. See conventions/.
- id: sse
  name: Server-Sent Events (text/event-stream)
  conforms: true
  evidence: >-
    POST /api/v2/assistant/chat/stream (streamAssistantChat) returns text/event-stream and, per
