domain_standards:
  sector: Nonprofit / philanthropy data (United States)
  note: >-
    Recorded from the contract, per the 0.12.0 domain_standard_conformance rule. The U.S. nonprofit sector has no
    formal API-interchange standard; what exists is a shared regulatory vocabulary (IRS Form 990 family, EIN) and
    a shared classification (NTEE). The contract declares the first two by name; NTEE is observed in values and
    in the provider's own sitemap naming but is not named inside the spec.
  entries:
  - id: irs-form-990
    name: IRS Form 990 form-type taxonomy (990, 990-EZ, 990-N, 990-PF, 990-T)
    conforms: true
    declared_in_contract: true
    evidence: >-
      openapi/_original/charitysense-com-openapi-original.yaml components.parameters.Form.schema.enum =
      [990, 990EZ, 990N, 990PF, 990T]; CharityPage.Context.SelectedForm carries the same enum; searchOrganizations
      parameter PrimaryForm repeats it; info.description and INSTRUCTIONS_FOR_AGENTS.md call these "first-class
      form contexts". Live CharityPage.Hero.Form/Year and SearchHit.PrimaryForm/FormTypes values ("990EZ",
      ["990EZ","990N"]) confirmed the vocabulary in use.
  - id: ein
    name: IRS Employer Identification Number as the organization identifier
    conforms: true
    declared_in_contract: true
    evidence: >-
      components.parameters.Ein: path parameter "ein", integer 10000000-999999999, "Nine-digit Employer
      Identification Number"; EIN is the key on SearchHit, Funder, GranteeList, FunderList, AwardList, SubawardList,
      CharityQuestionRequest and AgentFeedbackRequest, and the public profile URL template is /charity/{ein}. The
      JSON-LD on those pages emits the same value as schema.org taxID.
  - id: ntee
    name: NTEE (National Taxonomy of Exempt Entities) cause classification
    conforms: true
    declared_in_contract: false
    evidence: >-
      SearchHit.CauseCode returned NTEE-format codes live (e.g. "T30" for "Public Foundations" on EIN 581771391),
      SearchHit.Cause descriptions match NTEE major-group labels, and the provider's sitemap index at
      https://data.charitysense.com/sitemap.xml is partitioned into sitemap-ntee-a ... sitemap-ntee-z files. The
      OpenAPI documents CauseCode only as a string ("The IRS classification labels this cause holds") and never
      names NTEE, so this is an observed, not declared, conformance.
  - id: schema-org-ngo
    name: schema.org NGO / Organization JSON-LD on public profile pages
    conforms: true
    declared_in_contract: false
    evidence: >-
      https://data.charitysense.com/charity/530196605 (200) embeds application/ld+json with @type ["NGO",
      "Organization"], legalName, taxID, sameAs, keywords and additionalProperty entries. This is the HTML surface
      the agent card's cite_public_charity_profile skill points at, not the API contract.
