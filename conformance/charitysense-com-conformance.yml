- id: apis-json
  name: APIs.json
  conforms: false
  evidence: /apis.json, /apis.yml and /.well-known/apis.json 404 on all five hosts.
- id: mcp
  name: Model Context Protocol
  conforms: false
  evidence: >-
    https://data.charitysense.com/mcp.json returns {"mcp_server": false, ...}; /mcp and /.well-known/mcp.json 404.
