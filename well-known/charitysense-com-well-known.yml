method: probed
source: >-
  Live GET probes of the named /.well-known/* path list (plus /apis.json, /apis.yml and the root discovery
  documents the provider's own Link header and api-catalog advertise) on five hosts, 2026-09-19. Every row is a
  request that was actually issued; every status is the one returned. Files are saved verbatim.
summary:
  hosts_probed: 5
  paths_probed: 76
  documents_served: 12
  note: >-
    The discovery surface lives on data.charitysense.com (mirrored byte-for-byte by api.charitysense.com, whose
    HTML canonical points at data.). It serves an RFC 9727 API catalog linkset with the RFC profile in its
    content-type, an OpenAI-style ai-plugin.json import manifest, an A2A-shaped agent card at BOTH the canonical
    and legacy paths (captured in a2a/), and root-level ai.txt, ai-profile.json, llms.txt, llms-full.txt and
    mcp.json. Every response includes a Link header advertising service-desc (openapi.yaml/json), alternates
    (llms.txt, ai.txt, ai-profile.json), service-meta (agent-card.json) and api-catalog. There is NO security.txt,
    NO OAuth/OIDC metadata (the API uses static bearer tokens / X-CharitySense-API-Key, not OAuth), NO apis.json
    and NO AAuth/UCP/ACP documents on any host. The apex charitysense.com (Next.js marketing site) and
    www.charitysense.com serve a real 404 page for every well-known path except /llms.txt; site.charitysense.com
    (live dashboards) 404s everything.
  false_positive_check: >-
    Every 404 on charitysense.com/www returned the same 23,662-byte Next.js not-found page, and every 404 on
    data./api. returned a ~4.9KB SPA not-found shell; each 200 recorded below was parsed (JSON object / linkset /
    text) before being counted as a document.
