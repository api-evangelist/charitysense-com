summary: >-
  Daily allowances, not per-second throttles. Anonymous research reads share a 1,000 request per UTC day
  allowance per client, signalled on every successful response with IETF-style RateLimit-Limit /
  RateLimit-Remaining / RateLimit-Reset headers (reset is the next UTC midnight as epoch seconds). Paid keys carry
  two separate daily allowances - Data and Advanced - whose "normal paid defaults" are 100,000 and 250; a key can
  read its own Limit / Used / Remaining / ResetAt at GET /api/v2/usage without spending either. Exhaustion is
  429; the provider says to wait before retrying.
