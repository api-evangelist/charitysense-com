  shapes: [string, '{ErrorCode, Message, ...}', 'FastAPI validation array [{type, loc, msg, input}]']
  media_type: application/json
  rfc9457: false
  retry: {never_unchanged: [400, 401, 404, 422], back_off: [429, 503], report: [500 AdvertisedSectionEmpty]}
